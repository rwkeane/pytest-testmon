[tox]
envlist =
    py311
    xdist-py311
    xdist-cov6-py311
    xdist-cov7-py311
    xdist-cov6-covmain-py311
    pytest8-py311
    pytest9-py314
    pytest9-py315
    scenarios-py311
    differential-py311


[pytest]
norecursedirs = .*
                dist
                experiments

[testenv]
passenv = PYTHONPATH
setenv = TESTMON_DATAFILE=.testmondata.tox
allowlist_externals = git
# the end-to-end suites (real git + pytest subprocesses) have their own envs below
commands = pytest -c tox.ini --tb=native -v -s {posargs:tests --ignore=tests/shared --ignore=tests/differential}
deps =
    xdist: pytest-xdist
    pytest8: pytest==8.3.5
    pytest9: pytest==9.0.1
    cov6: pytest-cov<7
    cov7: pytest-cov>=7,<8
    covmain: git+https://github.com/coveragepy/coveragepy@main#egg=coverage
    pytest-mock
    coverage<8
    hypothesis
    jsonschema

# L3/L4/L6: git scenarios, concurrent agents, faults, lifecycle, testmon-verify (Linux)
[testenv:scenarios-py311]
deps =
    {[testenv]deps}
    pytest-xdist
commands = pytest -c tox.ini --tb=native -v {posargs:tests/shared}

# L5: differential validation (soak: TESTMON_DIFF_SEEDS=0,1,...,19 TESTMON_DIFF_STEPS=25)
[testenv:differential-py311]
passenv = PYTHONPATH, TESTMON_DIFF_*
deps =
    {[testenv]deps}
    pytest-xdist
commands = pytest -c tox.ini --tb=native -v {posargs:tests/differential}


[gh-actions]
python =
    3.11: pytest8-py311, xdist-py311, xdist-cov6-py311, xdist-cov7-py311, xdist-cov6-covmain-py311, scenarios-py311, differential-py311
    3.14: pytest9-py314
    3.15: pytest9-py315
